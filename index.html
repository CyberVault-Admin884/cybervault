<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBERVAULT TERMINAL OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:monospace;
    background:#000;
    color:#00ffea;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
        to bottom,
        rgba(0,255,255,0.05),
        rgba(0,255,255,0.05) 1px,
        transparent 1px,
        transparent 4px
    );
    animation:scan 6s linear infinite;
    pointer-events:none;
}

@keyframes scan{
    0%{transform:translateY(0);}
    100%{transform:translateY(40px);}
}

#boot{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.boot-line{
    opacity:0;
    animation:show 0.5s forwards;
}

@keyframes show{to{opacity:1;}}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
    display:none;
}

.card{
    background:rgba(0,40,50,0.2);
    border:1px solid #00ffea55;
    padding:15px;
    margin-top:12px;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    background:#00ffea;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

input{
    width:100%;
    padding:10px;
    margin-top:8px;
    background:#000;
    border:1px solid #00ffea;
    color:#00ffea;
}

table{
    width:100%;
    margin-top:10px;
    border-collapse:collapse;
}

td,th{
    border:1px solid #00ffea33;
    padding:8px;
    font-size:12px;
}

.signature{
    text-align:center;
    margin-top:15px;
    font-size:11px;
    opacity:0.6;
}
</style>
</head>

<body>

<div id="boot">
<div class="boot-line">INITIALIZING CYBERVAULT...</div>
<div class="boot-line">LOADING ADMIN MODULE...</div>
<div class="boot-line">SYSTEM READY ✓</div>
</div>

<div class="container" id="app">

<h2>CYBERVAULT ADMIN TERMINAL</h2>

<div class="card">
<h3>USER REQUEST</h3>

<input id="phone" placeholder="ENTER USER PHONE">
<button onclick="request()">CREATE USER REQUEST</button>
</div>

<div class="card">
<h3>ADMIN DASHBOARD</h3>

<table>
<thead>
<tr>
<th>PHONE</th>
<th>KEY</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="usersTable"></tbody>
</table>
</div>

<div class="card">
<h3>VERIFY USER LOGIN</h3>

<input id="loginPhone" placeholder="PHONE">
<input id="loginKey" placeholder="ACCESS KEY">
<button onclick="login()">GENERATE PASSWORD</button>

<p id="result"></p>
</div>

<div class="signature">
GLOOM CYBER SIGNATURE // DEVELOPED BY PREVELLah © 2026
</div>

</div>

<script>

setTimeout(()=>{
document.getElementById("boot").style.display="none";
document.getElementById("app").style.display="block";
render();
},3000);

let users = JSON.parse(localStorage.getItem("cv_users") || "{}");
let password = "";

function save(){
localStorage.setItem("cv_users", JSON.stringify(users));
}

function request(){
let p=document.getElementById("phone").value;

if(!p) return alert("ENTER PHONE");

let key = "CV-" + Math.random().toString(36).substring(2,10).toUpperCase();

users[p]={
key:key,
status:"PENDING"
};

save();
render();

alert("USER CREATED\nKEY: " + key);
}

function approve(phone){
users[phone].status="APPROVED";
save();
render();
}

function render(){
let table=document.getElementById("usersTable");
table.innerHTML="";

for(let p in users){
table.innerHTML += `
<tr>
<td>${p}</td>
<td>${users[p].key}</td>
<td>${users[p].status}</td>
<td>
<button onclick="approve('${p}')">APPROVE</button>
</td>
</tr>
`;
}
}

function login(){
let p=document.getElementById("loginPhone").value;
let k=document.getElementById("loginKey").value;

if(!users[p]) return alert("USER NOT FOUND");

if(users[p].status!=="APPROVED") return alert("NOT APPROVED");

if(users[p].key!==k) return alert("INVALID KEY");

password=Math.random().toString(36).substring(2,14);

document.getElementById("result").innerText =
"PASSWORD: " + password;
}

</script>

</body>
</html>
