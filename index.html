A<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | PREVELLAH Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass-card p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold text-green-400 mb-2">Checkout</h2>
        <p class="text-slate-400 text-sm mb-6">Support PREVELLAH Labs</p>

        <div class="mb-8">
            <span class="text-5xl font-extrabold">1</span>
            <span class="text-slate-400 ml-2 text-xl font-semibold">KES</span>
        </div>

        <div class="space-y-4">
            <input type="number" id="phone" placeholder="Enter M-Pesa Number (07...)" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
            
            <button onclick="processPayment()" id="payBtn"
                class="w-full bg-green-500 hover:bg-green-400 text-slate-900 font-bold py-4 rounded-lg transition-all transform active:scale-95 shadow-lg">
                PAY NOW
            </button>
        </div>

        <p class="mt-6 text-xs text-slate-500 flex items-center justify-center gap-1">
            Secure Encryption Active 🔐
        </p>
    </div>

    <script>
        async function processPayment() {
            const phoneInput = document.getElementById('phone').value;
            const payBtn = document.getElementById('payBtn');
            
            // YOUR TINYPESA API KEY
            const apiKey = "SGiJfke_I77BIsFE0iJKgKhiVK7zquxzadMI7WIA";

            if (!phoneInput) {
                alert("Please enter a phone number");
                return;
            }

            // Format phone number to 254...
            let formattedPhone = phoneInput;
            if (phoneInput.startsWith('0')) {
                formattedPhone = '254' + phoneInput.substring(1);
            }

            // Update UI to show processing
            payBtn.innerText = "PROCESSING...";
            payBtn.disabled = true;

            try {
                const response = await fetch("https://tinypesa.com/api/v1/express/initialize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "ApiKey": apiKey
                    },
                    body: new URLSearchParams({
                        "amount": "1",
                        "msisdn": formattedPhone,
                        "account_no": "CyberVault_Lab"
                    })
                });

                if (response.ok) {
                    alert("STK Push Sent! Enter your M-Pesa PIN on your phone.");
                } else {
                    const err = await response.json();
                    alert("Error: " + (err.message || "Request failed"));
                }
            } catch (error) {
                alert("Network error. Check your connection.");
            } finally {
                payBtn.innerText = "PAY NOW";
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
