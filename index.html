<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Vault | Diagnostic Terminal</title>
  <style>
    /* Global Tactical Dark Theme */
    body {
      background-color: #050505;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #00ff00;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
      margin-top: 40px;
    }

    h1 {
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .profile-banner {
      border-bottom: 1px dashed #00ff00;
      padding-bottom: 10px;
      margin-bottom: 25px;
      font-size: 0.9rem;
      color: #888;
    }

    .profile-banner span {
      color: #00ff00;
      font-weight: bold;
    }

    .display-box {
      background: #000;
      border: 1px solid #00ff00;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 25px;
      letter-spacing: 1px;
      word-break: break-all;
      min-height: 28px;
    }

    .slider-container {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    /* Custom Green Matrix Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: #111;
      border: 1px solid #00ff00;
      height: 8px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: #00ff00;
      cursor: pointer;
      box-shadow: 0 0 8px #00ff00;
    }

    .strength-output {
      margin-top: 20px;
      border-top: 1px dashed #00ff00;
      padding-top: 15px;
      font-size: 1.1rem;
    }

    .status-alert {
      font-weight: bold;
      color: #ff0000;
      text-transform: uppercase;
    }

    .status-secure {
      font-weight: bold;
      color: #00ff00;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container" id="vault-core">
    <h1>Cyber Vault</h1>
    
    <div class="profile-banner">
      Crypt Profile Identity: <span>VantaX // SECURED</span>
    </div>

    <div class="display-box" id="password-display">Select length to initialize...</div>

    <div class="slider-container">
      <label for="length-slider">Entropy Length Matrix: <span id="length-val">12</span></label>
      <input type="range" id="length-slider" min="4" max="32" value="12">
    </div>

    <div class="strength-output">
      Diagnostic Metric Status: <span id="strength-status" class="status-secure">Analyzing...</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. PASSWORD GENERATOR & EXPONENT LOGIC
    // ==========================================
    const slider = document.getElementById("length-slider");
    const lengthVal = document.getElementById("length-val");
    const passwordDisplay = document.getElementById("password-display");
    const strengthStatus = document.getElementById("strength-status");

    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";

    function generateNewPassword(length) {
      let password = "";
      // Loop execution matches our geometric length constraints
      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
      }
      passwordDisplay.innerText = password;
      analyzePasswordStrength(length);
    }

    function analyzePasswordStrength(length) {
      // Real mathematical complexity calculation based on length combinations
      if (length < 8) {
        strengthStatus.className = "status-alert";
        strengthStatus.innerText = "CRITICAL FLAWS DETECTED (Crack Time: Milliseconds)";
      } else if (length >= 8 && length < 14) {
        strengthStatus.className = "status-secure";
        strengthStatus.style.color = "#ffff00"; // Yellow warning indicator
        strengthStatus.innerText = "STANDARD PROTECTION (Crack Time: Years)";
      } else {
        strengthStatus.className = "status-secure";
        strengthStatus.style.color = "#00ff00"; // Green master secure indicator
        strengthStatus.innerText = "MILITARY-GRADE SECURITY (Crack Time: INFINITE)";
      }
    }

    // Bind slider events to dynamically alter calculations via parseInt()
    slider.addEventListener("input", (e) => {
      const currentLength = parseInt(e.target.value);
      lengthVal.innerText = currentLength;
      generateNewPassword(currentLength);
    });

    // Initialize terminal session status on window load
    window.onload = () => {
      generateNewPassword(parseInt(slider.value));
    };


    // ==========================================
    // 2. DEFENSIVE TRAP: DEVTOOLS INTERCEPTION
    // ==========================================
    const detectIntruder = () => {
      const threshold = 160;
      
      // Target desktop viewports to bypass false mobile flags
      if (window.innerWidth > 768) {
        if (window.outerWidth - window.innerWidth > threshold || 
            window.outerHeight - window.innerHeight > threshold) {
          
          // Execute UI lock-out sequence immediately
          document.body.innerHTML = `
            <div style="background:#050505; color:#00ff00; font-family:monospace; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; box-sizing:border-box;">
              <h2 style="color:#ff0000; letter-spacing: 2px;">[!] CRITICAL WARNING: INTRUSION DETECTED</h2>
              <p style="font-size: 1.1rem; margin-top: 10px;">Unauthorized inspection of Cyber Vault source code detected.</p>
              <p style="color:#888;">Crypt Profile Identity: SECURED.</p>
              <button onclick="location.reload()" style="background:transparent; border:1px solid #00ff00; color:#00ff00; padding:10px 20px; margin-top:20px; cursor:pointer; font-family:monospace;">RE-AUTHENTICATE</button>
            </div>
          `;
          console.warn("Nice try! Cyber Vault is fully locked down.");
          clearInterval(intruderCheck);
        }
      }
    };
    const intruderCheck = setInterval(detectIntruder, 1000);


    // ==========================================
    // 3. DEFENSIVE TRAP: HONEY-TOKEN DECEPTION
    // ==========================================
    // Plant bait parameter keys in client storage cache memory
    localStorage.setItem('admin_session_key', 'VAULT_MASTER_SECRET_DO_NOT_ALTER');

    // Watch for manipulation or value modification strings
    window.addEventListener('storage', (event) => {
      if (event.key === 'admin_session_key') {
        alert("ALERT: Honey-token tampering detected! Vault entry denied.");
        localStorage.clear();
        window.location.reload();
      }
    });
  </script>
</body>
</html>
