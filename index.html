<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERVAULT | PREVELLAH SEC-OPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #00ff41; margin: 0; overflow: hidden; }
        #main-content { clip-path: circle(0% at 50% 50%); transition: clip-path 1.8s cubic-bezier(0.77, 0, 0.175, 1); opacity: 0; }
        #main-content.open { clip-path: circle(150% at 50% 50%); opacity: 1; }
        .glow-border { box-shadow: 0 0 30px rgba(0, 255, 65, 0.15); border: 1px solid rgba(0, 255, 65, 0.3); }
        .shake { animation: shake 0.4s both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative p-4 text-center">
    <div id="start-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#050505] transition-opacity duration-1000">
        <h1 class="text-4xl font-black tracking-[0.4em] text-white uppercase">Prevellah</h1>
        <button onclick="unlockVault()" class="mt-16 px-12 py-6 border-2 border-green-500 text-green-500 font-black text-xs uppercase tracking-[0.5em] rounded-full animate-pulse">Initialize</button>
    </div>
    <div id="main-content" class="w-full max-w-xl transition-all duration-500">
        <h1 class="text-2xl font-black text-white tracking-widest uppercase mb-2">Cyber<span class="text-green-500">Vault</span></h1>
        <p class="text-[8px] text-green-500/50 font-bold uppercase tracking-[0.6em] mb-8">v4.0 Final | Clipboard-Enabled</p>
        <div id="vault-box" class="w-full bg-black/80 backdrop-blur-lg p-8 rounded-[2rem] glow-border">
            <div id="auth-ui">
                <input type="text" id="creds" maxlength="10" placeholder="07XXXXXXXX" class="w-full bg-zinc-900/60 border border-zinc-800 py-5 text-center text-white font-bold rounded-2xl outline-none focus:border-green-500 mb-6 tracking-[0.2em]">
                <button onclick="validateAuth()" class="w-full bg-green-500 text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-widest">Authorize Access</button>
            </div>
            <div id="terminal-feed"></div>
        </div>
    </div>
    <script>
        let currentPass = "";
        function unlockVault() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('main-content').classList.add('open');
            }, 800);
        }
        function gen() {
            const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*";
            const pr = ["SEC", "NODE", "VLT", "OPS"];
            let p = pr[Math.floor(Math.random()*pr.length)] + "-";
            for (let i=0; i<16; i++) p += c.charAt(Math.floor(Math.random()*c.length));
            currentPass = p; return p;
        }
        async function copyKey(btn) {
            try {
                await navigator.clipboard.writeText(currentPass);
                const old = btn.innerText;
                btn.innerText = "COPIED TO CLIPBOARD!";
                btn.style.backgroundColor = "#00ff41";
                setTimeout(() => { btn.innerText = old; btn.style.backgroundColor = "white"; }, 2000);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = currentPass;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                alert("Key Copied!");
            }
        }
        function openGenerator() {
            document.getElementById('vault-box').innerHTML = `
                <p class="text-green-500 text-[8px] font-black mb-4 uppercase">Master Key Ready</p>
                <div id="pass-display" class="text-xl font-black text-white py-10 my-4 bg-zinc-900/40 rounded-3xl border border-green-500/20 break-all px-4">${gen()}</div>
                <button onclick="copyKey(this)" class="w-full bg-white text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-widest">Copy to Clipboard</button>
                <button onclick="document.getElementById('pass-display').innerText = gen()" class="w-full mt-4 border border-zinc-700 text-zinc-500 font-black py-5 rounded-2xl text-[10px] uppercase">New Key</button>`;
        }
        function validateAuth() {
            const v = document.getElementById('creds').value;
            if (v === "0000" || /^(07|01)\d{8}$/.test(v)) {
                document.getElementById('auth-ui').classList.add('hidden');
                document.getElementById('terminal-feed').innerHTML = `
                    <p class="text-green-500 text-[9px] font-black uppercase mb-4 tracking-widest">Maintenance Fee: 1 KES</p>
                    <div class="text-[11px] text-zinc-400 bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800 mb-6">Pochi La Biashara ID:<br><span class="text-white font-bold text-lg">0142122710</span></div>
                    <input type="text" id="m" placeholder="M-PESA CODE" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl text-white text-xs text-center uppercase outline-none mb-4">
                    <button onclick="openGenerator()" class="w-full bg-white text-black font-black py-5 rounded-2xl text-[10px] uppercase">Unlock</button>`;
            } else {
                document.getElementById('vault-box').classList.add('shake');
                setTimeout(() => document.getElementById('vault-box').classList.remove('shake'), 500);
            }
        }
    </script>
</body>
</html>
