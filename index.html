<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERVAULT // SECURE NODE</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#000;
    color:#00ffcc;
    overflow:hidden;
}

/* MATRIX */
canvas{
    position:fixed;
    inset:0;
    opacity:0.15;
    z-index:0;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    text-align:center;
    transition:opacity 0.5s ease;
}

.title{
    font-size:28px;
    color:#00ffcc;
    text-shadow:0 0 12px #00ffcc;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{opacity:0.3}
    50%{opacity:1}
    100%{opacity:0.3}
}

.loader{
    width:35px;
    height:35px;
    border:3px solid #00ffcc33;
    border-top:3px solid #00ffcc;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-top:15px;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

.small{
    font-size:12px;
    color:#888;
    margin-top:10px;
}

/* APP */
#app{
    display:none;
    position:relative;
    z-index:2;
    padding:15px;
}

/* CARD */
.card{
    background:rgba(0,0,0,0.8);
    border:1px solid #00ffcc33;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#000;
    border:1px solid #00ffcc33;
    color:#00ffcc;
    border-radius:8px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#00ffcc;
    border:none;
    font-weight:bold;
    margin-top:10px;
}

/* EXIT */
.exit{
    background:#ff0033;
    color:white;
}

/* PASSWORD */
.password{
    color:#00ff99;
    word-break:break-all;
}

/* ERROR */
.error{
    color:#ff5555;
    font-size:11px
