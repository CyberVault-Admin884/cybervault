<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBERVAULT | Secure System</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#020617;
    color:#7dd3fc;
    overflow-x:hidden;
}

/* ===== BOOT ===== */
#boot{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

.loader{
    width:50px;
    height:50px;
    margin-top:15px;
    border-radius:50%;
    border:3px solid #1e293b;
    border-top:3px solid #38bdf8;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* ===== APP ===== */
.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

.card{
    background:#0f172a;
    padding:18px;
    margin-top:15px;
    border-radius:14px;
    border:1px solid #1e293b;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #334155;
    background:#020617;
    color:#7dd3fc;
    outline:none;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{ background:#38bdf8; color:#000; }
.secondary{ background:#1e293b; color:#7dd3fc; }

.box{
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#020617;
    border:1px solid #334155;
    word-break:break-all;
    min-height:40px;
    color:#4ade80;
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">
    <div class="logo">CYBERVAULT</div>
    <div class="loader"></div>
    <p style="font-size:12px;margin-top:10px;">
        Initializing secure system...
    </p>
</div>

<!-- APP -->
<div class="container" id="app" style="display:none;">

<h2>CYBERVAULT VAULT SYSTEM</h2>

<div class="card">

<h3>User Request</h3>

<input id="phone" placeholder="Enter phone number">

<button class="primary" onclick="submitRequest()">
Submit Request
</button>

<p id="status" style="font-size:12px;color:#93c5fd;">
Waiting for admin approval...
</p>

</div>

<div class="card">

<h3>Voucher Entry</h3>

<input id="voucher" placeholder="Enter voucher">

<button class="primary" onclick="verifyVoucher()">
Unlock System
</button>

</div>

<div class="card">

<h3>Password Generator</h3>

<div class="box" id="output">LOCKED</div>

<button class="secondary" onclick="copyPass()">
Copy Password
</button>

</div>

<div class="card">

<h3>Admin Panel</h3>

<input id="adminPhone" placeholder="User phone">

<button class="primary" onclick="generateVoucher()">
Generate Voucher
</button>

<div class="box" id="adminOut"></div>

</div>

</div>

<script>

/* =========================
   SAFE BOOT (NO FREEZE EVER)
========================= */
(function () {

    function startApp(){
        const boot = document.getElementById("boot");
        const app = document.getElementById("app");

        if(boot){
            boot.style.opacity="0";
            boot.style.transition="0.4s";
            setTimeout(()=>boot.style.display="none",400);
        }

        if(app){
            app.style.display="block";
        }
    }

    setTimeout(startApp,2000);
    setTimeout(startApp,3000);

})();

/* =========================
   SYSTEM LOGIC
========================= */

let activeUser = null;

/* USER REQUEST */
function submitRequest(){

    const phone = document.getElementById("phone").value;

    if(phone.length < 10){
        alert("Invalid number");
        return;
    }

    activeUser = phone;

    localStorage.setItem("status","pending");

    document.getElementById("status").innerText =
    "Request sent. Await voucher.";

}

/* ADMIN GENERATE VOUCHER */
function generateVoucher(){

    const phone = document.getElementById("adminPhone").value;

    if(phone.length < 10){
        alert("Invalid phone");
        return;
    }

    const voucher =
    "CV-" + Math.random().toString(36).substring(2,8).toUpperCase();

    localStorage.setItem("voucher_"+phone, voucher);

    document.getElementById("adminOut").innerText =
    "PHONE: " + phone + "\nVOUCHER: " + voucher;

}

/* VERIFY VOUCHER */
function verifyVoucher(){

    const v = document.getElementById("voucher").value;
    const stored = localStorage.getItem("voucher_"+activeUser);

    if(!stored){
        alert("No voucher assigned yet");
        return;
    }

    if(v !== stored){
        alert("Invalid voucher");
        return;
    }

    const pass = generatePassword(20);

    document.getElementById("output").innerText = pass;
}

/* PASSWORD */
function generatePassword(len){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";

    let p="";

    for(let i=0;i<len;i++){
        p += chars[Math.floor(Math.random()*chars.length)];
    }

    return p;
}

/* COPY */
function copyPass(){

    const text = document.getElementById("output").innerText;

    if(text === "LOCKED"){
        alert("Nothing generated");
        return;
    }

    navigator.clipboard.writeText(text);
    alert("Copied");
}

</script>

</body>
</html>
