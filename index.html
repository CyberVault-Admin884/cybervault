<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERVAULT | Secure Password Generator</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#000;
    color:#00d9ff;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1000px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:#0a0a0a;
    border:1px solid #00d9ff55;
    padding:20px;
    border-radius:12px;
}

h2{
    margin-top:0;
    color:#00d9ff;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    background:black;
    border:1px solid #00d9ff55;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#00d9ff;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#aaa;
}

.item{
    border:1px solid #222;
    padding:10px;
    margin:10px 0;
}

.password{
    color:#00ff99;
    font-weight:bold;
    word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

<!-- USER SIDE -->
<div class="card">
<h2>USER PANEL</h2>

<p class="small">
Pay 1 KES via Pochi La Biashara:<br>
*334# → 0142122710
</p>

<input id="phone" placeholder="Phone Number">
<input id="code" placeholder="M-PESA Transaction Code">

<button onclick="submitRequest()">Submit Request</button>

<p id="msg"></p>
</div>

<!-- ADMIN SIDE -->
<div class="card">
<h2>ADMIN PANEL</h2>
<div id="list"></div>
</div>

</div>

<script>

// DATABASE (LOCAL)
let db = [];

// SUBMIT USER REQUEST
function submitRequest(){

    const phone = document.getElementById("phone").value;
    const code = document.getElementById("code").value;

    if(!phone || !code){
        alert("Fill all fields");
        return;
    }

    db.push({
        id: Date.now(),
        phone,
        code,
        status:"pending",
        password:null
    });

    document.getElementById("msg").innerText =
    "Request submitted. Await approval.";

    render();
}

// SECURE PASSWORD GENERATOR
function generatePassword(length = 24){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "abcdefghijklmnopqrstuvwxyz" +
    "0123456789" +
    "!@#$%^&*()-_=+[]{}<>?/";

    let result = "";

    const array = new Uint32Array(length);
    crypto.getRandomValues(array);

    for(let i = 0; i < length; i++){
        result += chars[array[i] % chars.length];
    }

    return result;
}

// ADMIN APPROVE
function approve(id){

    const item = db.find(x => x.id === id);

    if(!item) return;

    const password = generatePassword(24);

    item.status = "approved";
    item.password = password;

    alert("PASSWORD GENERATED:\n\n" + password);

    render();
}

// RENDER ADMIN LIST
function render(){

    const list = document.getElementById("list");

    list.innerHTML = db.map(i => `

        <div class="item">

            <p><b>Phone:</b> ${i.phone}</p>
            <p><b>Code:</b> ${i.code}</p>
            <p><b>Status:</b> ${i.status}</p>

            ${i.password ? `
                <p class="password">PASSWORD: ${i.password}</p>
            ` : ""}

            ${i.status === "pending" ? `
                <button onclick="approve(${i.id})">
                    Approve & Generate Password
                </button>
            ` : ""}

        </div>

    `).join("");
}

render();

</script>

</body>
    </html>
