<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVAULT | TERMINAL V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: 'JetBrains Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .card { background: rgba(15, 15, 15, 0.95); border: 1px solid #1a1a1a; border-radius: 1.5rem; width: 100%; max-width: 360px; }
        .btn-green { background: #00ff41; color: #000; font-weight: 900; }
        .btn-green:active { background: #fff; transform: scale(0.98); }
    </style>
</head>
<body class="p-6 space-y-6">

    <div class="text-center py-4">
        <h1 class="text-3xl font-black italic text-white uppercase">Cyber<span class="text-green-500">Vault</span></h1>
        <p class="text-[8px] tracking-[0.4em] uppercase opacity-50">Eldoret Sec-Ops Node</p>
    </div>

    <div class="card p-6 space-y-3">
        <h2 class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Protocol Briefing</h2>
        <p class="text-[11px] leading-relaxed text-zinc-400">
            System generates <span class="text-white">256-bit entropy keys</span>. A <span class="text-white font-bold">1 KES</span> maintenance fee applies via Pochi La Biashara.
        </p>
    </div>

    <div id="action-card" class="card p-6 border-t-2 border-t-green-500">
        <div id="dynamic-content" class="space-y-5">
            <p class="text-[9px] text-center uppercase tracking-widest text-zinc-600">Enter Access ID</p>
            <input type="text" id="uid" placeholder="07XXXXXXXX" class="w-full bg-black border border-zinc-800 rounded-xl py-4 text-center text-white font-bold outline-none focus:border-green-500 transition-all">
            <button onclick="checkID()" class="w-full btn-green py-4 rounded-xl text-[10px] uppercase tracking-widest">Initialize Node</button>
        </div>
    </div>

    <div class="pt-10">
        <a href="https://github.com/CyberVault-Admin884/cybervault" class="text-[8px] text-zinc-700 uppercase tracking-[0.5em] hover:text-green-500 transition-colors">Terminate Connection [EXIT]</a>
    </div>

    <script>
        let generatedKey = "";

        function checkID() {
            const input = document.getElementById('uid').value;
            if (input === "0000" || /^(07|01)\d{8}$/.test(input)) {
                document.getElementById('dynamic-content').innerHTML = `<div class="py-10 text-center animate-pulse text-[10px] tracking-widest">DECRYPTING...</div>`;
                setTimeout(showPayment, 1200);
            }
        }

        function showPayment() {
            document.getElementById('dynamic-content').innerHTML = `
                <div class="space-y-4 animate-in slide-in-from-bottom duration-300">
                    <div class="bg-zinc-900/50 p-5 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase mb-2">Pochi La Biashara</p>
                        <p class="text-2xl font-black text-white">0142122710</p>
                        <p class="text-[9px] text-green-500 mt-2 font-bold uppercase tracking-widest">Maintenance: 1 KES</p>
                    </div>
                    <input type="text" id="mcode" placeholder="M-PESA CODE" class="w-full bg-black border border-zinc-800 py-4 rounded-xl text-center text-white text-[10px] font-bold outline-none focus:border-green-500 uppercase">
                    <button onclick="generateFinalKey()" class="w-full bg-white text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-widest">Unlock Vault</button>
                </div>`;
        }

        function generateFinalKey() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%";
            generatedKey = "SEC-" + Array.from({length: 12}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            
            document.getElementById('dynamic-content').innerHTML = `
                <div class="space-y-6 text-center animate-in zoom-in duration-300">
                    <p class="text-[8px] text-green-500 font-bold tracking-widest uppercase">Master Key Locked</p>
                    <div class="bg-black py-8 rounded-2xl border border-green-500/30 text-white font-bold break-all px-4 text-lg">${generatedKey}</div>
                    <button onclick="copyToClipboard(this)" class="w-full btn-green py-4 rounded-xl text-[10px] uppercase tracking-widest">Copy to Clipboard</button>
                    <button onclick="location.reload()" class="w-full text-zinc-700 text-[8px] font-bold uppercase tracking-[0.2em] pt-2">New Session</button>
                </div>`;
        }

        async function copyToClipboard(btn) {
            try {
                await navigator.clipboard.writeText(generatedKey);
                btn.innerText = "✓ COPIED TO CLIPBOARD";
                btn.style.backgroundColor = "#fff";
                setTimeout(() => {
                    btn.innerText = "Copy to Clipboard";
                    btn.style.backgroundColor = "#00ff41";
                }, 2000);
            } catch(e) {
                alert("KEY: " + generatedKey);
            }
        }
    </script>
</body>
</html>
