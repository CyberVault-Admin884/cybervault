<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBERVAULT | Secure Manual SaaS</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#020617;
    color:#7dd3fc;
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

.card{
    background:#0f172a;
    padding:18px;
    margin-top:15px;
    border-radius:14px;
    border:1px solid #1e293b;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #334155;
    background:#020617;
    color:#7dd3fc;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{ background:#38bdf8; color:#000; }
.secondary{ background:#1e293b; color:#7dd3fc; }
.danger{ background:#ef4444; color:#fff; }

.box{
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#020617;
    border:1px solid #334155;
    word-break:break-all;
    min-height:40px;
    color:#4ade80;
}

.status{
    margin-top:10px;
    font-size:12px;
    color:#93c5fd;
}
</style>
</head>

<body>

<div class="container">

<h2>CYBERVAULT MANUAL SAAS</h2>

<!-- USER SECTION -->
<div class="card">

<h3>User Request</h3>

<input id="phone" placeholder="Enter phone">

<button class="primary" onclick="submitRequest()">
Submit Request
</button>

<div class="status" id="status">
Waiting for admin approval...
</div>

</div>

<!-- VOUCHER SECTION -->
<div class="card">

<h3>Enter Voucher</h3>

<input id="voucher" placeholder="Enter voucher code">

<button class="primary" onclick="verifyVoucher()">
Unlock System
</button>

</div>

<!-- OUTPUT -->
<div class="card">

<h3>Password Generator</h3>

<div class="box" id="output">LOCKED</div>

<button class="secondary" onclick="copyPass()">
Copy Password
</button>

</div>

<!-- ADMIN PANEL (SAME PAGE) -->
<div class="card">

<h3>Admin Panel (YOU)</h3>

<input id="adminPhone" placeholder="User phone">

<button class="primary" onclick="generateVoucher()">
Generate Voucher
</button>

<div class="box" id="adminOut"></div>

</div>

</div>

<script>

let activeUser = null;

/* USER REQUEST */
function submitRequest(){

    const phone = document.getElementById("phone").value;

    if(phone.length < 10){
        alert("Invalid number");
        return;
    }

    activeUser = phone;

    localStorage.setItem("status", "pending");

    document.getElementById("status").innerText =
    "Request submitted. Await voucher.";

}

/* ADMIN GENERATES VOUCHER */
function generateVoucher(){

    const phone =
    document.getElementById("adminPhone").value;

    const voucher =
    "CV-" + Math.random().toString(36).substring(2,8).toUpperCase();

    localStorage.setItem("voucher_"+phone, voucher);

    document.getElementById("adminOut").innerText =
    "PHONE: " + phone + "\nVOUCHER: " + voucher;

    alert("Voucher generated and sent manually.");
}

/* VERIFY VOUCHER */
function verifyVoucher(){

    const voucher =
    document.getElementById("voucher").value;

    const stored =
    localStorage.getItem("voucher_"+activeUser);

    if(voucher !== stored || !stored){
        alert("Invalid voucher");
        return;
    }

    const password = generatePassword(20);

    document.getElementById("output").innerText =
    password;

}

/* PASSWORD */
function generatePassword(len){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*";

    let p="";

    for(let i=0;i<len;i++){
        p += chars[Math.floor(Math.random()*chars.length)];
    }

    return p;
}

/* COPY */
function copyPass(){

    const t =
    document.getElementById("output").innerText;

    if(t==="LOCKED"){
        alert("Nothing generated");
        return;
    }

    navigator.clipboard.writeText(t);
    alert("Copied");
}

</script>

</body>
</html>
