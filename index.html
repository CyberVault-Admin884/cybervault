<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVAULT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #222; border-radius: 12px; width: 90%; max-width: 350px; padding: 24px; margin-bottom: 16px; }
        input { background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; width: 100%; padding: 12px; text-align: center; outline: none; margin-bottom: 16px; }
        input:focus { border-color: #00ff41; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: #00ff41; color: #000; }
        .btn-copy { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div id="ui-container" class="w-full flex flex-col items-center">
        <div class="card">
            <h1 class="text-center font-bold mb-6 tracking-widest text-sm">CYBERVAULT V4</h1>
            <div id="flow">
                <input type="text" id="id-input" placeholder="07XXXXXXXX" maxlength="10">
                <button onclick="validate()" class="btn btn-primary">Authorize</button>
            </div>
        </div>
    </div>

    <script>
        let vaultKey = "";

        function validate() {
            const input = document.getElementById('id-input');
            const val = input.value;
            
            // Kenyan format check or test code
            if (val === "0000" || /^(07|01)\d{8}$/.test(val)) {
                showPay();
            } else {
                // Physical Vibration on error
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                input.style.borderColor = "#ff0000";
                setTimeout(() => { input.style.borderColor = "#333"; }, 500);
            }
        }

        function showPay() {
            document.getElementById('flow').innerHTML = `
                <div class="text-center space-y-4">
                    <div class="bg-zinc-900 p-4 rounded-lg">
                        <p class="text-[10px] text-zinc-500 mb-1">POCHI LA BIASHARA</p>
                        <p class="text-xl font-bold">0142122710</p>
                        <p class="text-[10px] text-green-500 mt-2 font-bold">FEE: 1 KES</p>
                    </div>
                    <input type="text" id="mpesa-code" placeholder="M-PESA CODE">
                    <button onclick="generate()" class="btn btn-primary">Generate Key</button>
                </div>`;
        }

        function generate() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%";
            vaultKey = "SEC-" + Array.from({length: 12}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            
            document.getElementById('flow').innerHTML = `
                <div class="text-center space-y-4">
                    <div class="bg-black border border-zinc-800 p-6 rounded-lg font-mono break-all">
                        ${vaultKey}
                    </div>
                    <button onclick="copy(this)" class="btn btn-copy">Copy to Clipboard</button>
                    <button onclick="location.reload()" class="text-[10px] text-zinc-600 mt-4 underline">Restart Session</button>
                </div>`;
        }

        async function copy(btn) {
            try {
                await navigator.clipboard.writeText(vaultKey);
                const originalText = btn.innerText;
                btn.innerText = "COPIED";
                btn.style.background = "#00ff41";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "#fff";
                }, 2000);
            } catch (e) {
                alert("KEY: " + vaultKey);
            }
        }
    </script>
</body>
</html>
