<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBERVAULT OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:monospace;
background:#000;
color:#00ffea;
overflow-x:hidden;
}

/* SCANLINES */
body::before{
content:"";
position:fixed;
inset:0;
background:repeating-linear-gradient(
to bottom,
rgba(0,255,255,0.05),
rgba(0,255,255,0.05) 1px,
transparent 1px,
transparent 4px
);
animation:scan 6s linear infinite;
pointer-events:none;
}

@keyframes scan{
0%{transform:translateY(0);}
100%{transform:translateY(40px);}
}

/* BOOT */
#boot{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
padding:20px;
z-index:9999;
}

.boot-line{
opacity:0;
animation:show 0.5s forwards;
}

@keyframes show{to{opacity:1;}}

/* LAYOUT */
.container{
max-width:800px;
margin:auto;
padding:20px;
}

.card{
border:1px solid #00ffea55;
padding:15px;
margin-top:10px;
background:rgba(0,40,50,0.2);
box-shadow:0 0 15px rgba(0,255,234,0.15);
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:#00ffea;
border:none;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
box-shadow:0 0 10px #00ffea;
}

input{
width:100%;
padding:10px;
margin-top:8px;
background:#000;
border:1px solid #00ffea;
color:#00ffea;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:12px;
}

td,th{
border:1px solid #00ffea33;
padding:6px;
}

.hidden{display:none;}

/* EXIT */
#exit{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
}

.modal{
background:#001010;
padding:20px;
border:1px solid #00ffea;
width:300px;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
<div class="boot-line">INITIALIZING CYBERVAULT OS...</div>
<div class="boot-line">LOADING SECURITY MODULES...</div>
<div class="boot-line">ENCRYPTING USER LAYER...</div>
<div class="boot-line">SYSTEM READY ✓</div>
</div>

<!-- EXIT -->
<div id="exit">
<div class="modal">
<p>EXIT SYSTEM?</p>
<button onclick="closeExit()">CANCEL</button>
<button onclick="exitNow()">EXIT</button>
</div>
</div>

<div class="container">

<h2>CYBERVAULT TERMINAL OS</h2>

<!-- MODE SWITCH -->
<div class="card">
<button onclick="showUser()">USER DASHBOARD</button>
<button onclick="lockAdmin()">ADMIN DASHBOARD</button>
</div>

<!-- USER -->
<div id="user">

<div class="card">
<h3>REQUEST ACCESS</h3>
<input id="phone" placeholder="ENTER PHONE">
<button onclick="request()">GENERATE KEY</button>
<p id="keyOut"></p>
<button onclick="copyKey()">COPY KEY</button>
</div>

<div class="card">
<h3>LOGIN SYSTEM</h3>
<input id="loginPhone" placeholder="PHONE">
<input id="loginKey" placeholder="ACCESS KEY">
<button onclick="login()">GENERATE PASSWORD</button>
<p id="result"></p>
<button onclick="copyPass()">COPY PASSWORD</button>
</div>

<button style="background:red;color:white;" onclick="showExit()">EXIT SYSTEM</button>

</div>

<!-- ADMIN -->
<div id="admin" class="hidden">

<div class="card">
<h3>ADMIN SECURITY GATE</h3>
<input id="adminPass" placeholder="ENTER SECURITY KEY">
<button onclick="adminLogin()">UNLOCK PANEL</button>
</div>

<div id="adminPanel" class="hidden">

<div class="card">
<h3>USER DATABASE</h3>

<table>
<thead>
<tr>
<th>PHONE</th>
<th>KEY</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("cv_users") || "{}");
let password="";
let lastKey="";

/* SAVE */
function save(){
localStorage.setItem("cv_users",JSON.stringify(users));
}

/* BOOT */
setTimeout(()=>{
document.getElementById("boot").style.display="none";
},3000);

/* USER */
function showUser(){
document.getElementById("user").classList.remove("hidden");
document.getElementById("admin").classList.add("hidden");
}

/* ADMIN LOCK */
function lockAdmin(){
document.getElementById("user").classList.add("hidden");
document.getElementById("admin").classList.remove("hidden");
}

/* REQUEST */
function request(){
let p=document.getElementById("phone").value;
if(!p)return;

let key="CV-"+Math.random().toString(36).substring(2,9).toUpperCase();

users[p]={key:key,status:"PENDING"};
save();

lastKey=key;
document.getElementById("keyOut").innerText="YOUR KEY: "+key;
}

/* LOGIN */
function login(){
let p=document.getElementById("loginPhone").value;
let k=document.getElementById("loginKey").value;

if(!users[p])return alert("NOT FOUND");
if(users[p].status!=="APPROVED")return alert("NOT APPROVED");
if(users[p].key!==k)return alert("INVALID KEY");

password=Math.random().toString(36).substring(2,12);
document.getElementById("result").innerText="PASSWORD: "+password;
}

/* COPY */
function copyKey(){
navigator.clipboard.writeText(lastKey||"");
alert("KEY COPIED");
}

function copyPass(){
navigator.clipboard.writeText(password||"");
alert("PASSWORD COPIED");
}

/* ADMIN LOGIN (UI SECURITY LAYER) */
function adminLogin(){
let pass=document.getElementById("adminPass").value;

/* “SECURITY LAYER” (frontend gate) */
if(pass==="CYBER-ADMIN-2026"){
document.getElementById("adminPanel").classList.remove("hidden");
render();
}else{
alert("ACCESS DENIED");
}
}

/* APPROVE */
function approve(p){
users[p].status="APPROVED";
save();
render();
}

/* TABLE */
function render(){
let t=document.getElementById("table");
t.innerHTML="";

for(let p in users){
t.innerHTML+=`
<tr>
<td>${p}</td>
<td>${users[p].key}</td>
<td>${users[p].status}</td>
<td><button onclick="approve('${p}')">APPROVE</button></td>
</tr>
`;
}
}

/* EXIT */
function showExit(){
document.getElementById("exit").style.display="flex";
}
function closeExit(){
document.getElementById("exit").style.display="none";
}
function exitNow(){
window.location.href="about:blank";
}

showUser();

</script>

</body>
</html>
