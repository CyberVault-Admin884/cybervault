<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERVAULT | FINAL BUILD</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#020617;
    color:#7dd3fc;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.glitch{
    font-size:32px;
    font-weight:bold;
    color:#38bdf8;
    text-shadow:0 0 10px #38bdf8,0 0 25px #0ea5e9;
    animation:flicker 1.5s infinite alternate;
}

@keyframes flicker{
    0%{opacity:1;}
    100%{opacity:0.6;}
}

.loader{
    width:50px;height:50px;
    margin-top:15px;
    border-radius:50%;
    border:3px solid #1e293b;
    border-top:3px solid #38bdf8;
    animation:spin 1s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg);}}

/* LAYOUT */
.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

.card{
    background:#0f172a;
    padding:16px;
    margin-top:15px;
    border-radius:12px;
    border:1px solid #1e293b;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #334155;
    background:#020617;
    color:#7dd3fc;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:#38bdf8;color:#000;}
.secondary{background:#1e293b;color:#7dd3fc;}
.danger{background:#ef4444;color:#fff;}

.box{
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#020617;
    border:1px solid #334155;
    word-break:break-all;
    color:#4ade80;
    min-height:40px;
}

/* ERROR */
.shake{animation:shake 0.3s linear 2;}
@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
    100%{transform:translateX(0);}
}

/* ADMIN */
#adminPanel{display:none;}

/* MODAL */
#exit{
    position:fixed;
    inset:0;
    display:none;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}
.modal{
    background:#0f172a;
    padding:20px;
    border-radius:12px;
}
</style>
</head>

<body>

<div id="boot">
    <div class="glitch">CYBERVAULT</div>
    <div class="loader"></div>
</div>

<div id="exit">
<div class="modal">
<p>Exit system?</p>
<button class="danger" onclick="exitNow()">Yes</button>
<button class="secondary" onclick="closeExit()">No</button>
</div>
</div>

<div class="container" id="app" style="display:none;">

<button class="danger" onclick="showExit()">EXIT</button>

<div class="card">
<h3>Guide</h3>
<small>
Pay via *334# → Pochi La Biashara<br>
Send 1 KES to 0142122710<br>
Phone = identity only
</small>
</div>

<div class="card">
<h3>Payment</h3>
<p>0142122710</p>
</div>

<div class="card">
<h3>User</h3>
<input id="phone" placeholder="Phone">
<button class="primary" onclick="req()">Submit</button>
<p id="status">Waiting...</p>
</div>

<div class="card">
<h3>Voucher</h3>
<input id="voucher">
<button class="primary" onclick="check()">Unlock</button>
</div>

<div class="card">
<h3>Key</h3>
<div class="box" id="out">LOCKED</div>
</div>

<div class="card">
<h3>Admin</h3>
<input id="key" placeholder="Admin key">
<button class="primary" onclick="unlock()">Unlock Admin</button>
</div>

<div class="card" id="adminPanel">
<h3>Admin Panel</h3>
<input id="ap">
<button class="primary" onclick="gen()">Generate</button>
<div class="box" id="aout"></div>
</div>

</div>

<script>

setTimeout(()=>{
document.getElementById("boot").style.display="none";
document.getElementById("app").style.display="block";
},2000);

function err(id){
document.getElementById(id).classList.add("shake");
setTimeout(()=>document.getElementById(id).classList.remove("shake"),400);
if(navigator.vibrate) navigator.vibrate(200);
}

function showExit(){
document.getElementById("exit").style.display="flex";
}
function closeExit(){
document.getElementById("exit").style.display="none";
}
function exitNow(){
window.location.href="about:blank";
}

let user=null;

function req(){
let p=document.getElementById("phone").value;
if(p.length<10){err("phone");return;}
user=p;
document.getElementById("status").innerText="Pending...";
}

function unlock(){
let k=document.getElementById("key").value;
if(k==="CYBER-ADMIN"){document.getElementById("adminPanel").style.display="block";}
else err("key");
}

function gen(){
let p=document.getElementById("ap").value;
let v="CV-"+Math.random().toString(36).slice(2,8).toUpperCase();
localStorage.setItem("voucher_"+p,v);
document.getElementById("aout").innerText=v;
}

function check(){
let v=document.getElementById("voucher").value;
let s=localStorage.getItem("voucher_"+user);
if(v!==s){err("voucher");return;}
document.getElementById("out").innerText=Math.random().toString(36).slice(2,18);
}

</script>

</body>
</html>
