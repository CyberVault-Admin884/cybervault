<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBERVAULT OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:monospace;
background:#000;
color:#00ffea;
}

.container{padding:20px;max-width:700px;margin:auto;}

.card{
border:1px solid #00ffea55;
padding:15px;
margin-top:10px;
background:rgba(0,40,50,0.2);
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:#00ffea;
border:none;
font-weight:bold;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin-top:8px;
background:#000;
border:1px solid #00ffea;
color:#00ffea;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:12px;
}

td,th{
border:1px solid #00ffea33;
padding:6px;
}

.modebar{
display:flex;
gap:10px;
}

.modebar button{
width:50%;
}
</style>
</head>

<body>

<div class="container">

<h2>CYBERVAULT SYSTEM</h2>

<div class="modebar">
<button onclick="setMode('user')">USER MODE</button>
<button onclick="setMode('admin')">ADMIN MODE</button>
</div>

<!-- USER -->
<div id="user">

<div class="card">
<h3>REQUEST ACCESS</h3>
<input id="phone" placeholder="ENTER PHONE">
<button onclick="request()">REQUEST</button>
<p id="keyOut"></p>
</div>

<div class="card">
<h3>LOGIN</h3>
<input id="loginPhone" placeholder="PHONE">
<input id="loginKey" placeholder="ACCESS KEY">
<button onclick="login()">GENERATE PASSWORD</button>
<p id="result"></p>
</div>

</div>

<!-- ADMIN -->
<div id="admin" style="display:none;">

<div class="card">
<h3>ADMIN DASHBOARD</h3>
<table>
<thead>
<tr>
<th>PHONE</th>
<th>KEY</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("cv_users") || "{}");
let password="";

function save(){
localStorage.setItem("cv_users",JSON.stringify(users));
}

/* MODE SWITCH */
function setMode(m){
document.getElementById("user").style.display = m==="user"?"block":"none";
document.getElementById("admin").style.display = m==="admin"?"block":"none";
render();
}

/* USER REQUEST */
function request(){
let p=document.getElementById("phone").value;
if(!p)return;

let key="CV-"+Math.random().toString(36).substring(2,9).toUpperCase();

users[p]={key:key,status:"PENDING"};
save();

document.getElementById("keyOut").innerText="YOUR KEY: "+key;
}

/* LOGIN */
function login(){
let p=document.getElementById("loginPhone").value;
let k=document.getElementById("loginKey").value;

if(!users[p])return alert("NOT FOUND");
if(users[p].status!=="APPROVED")return alert("NOT APPROVED");
if(users[p].key!==k)return alert("WRONG KEY");

password=Math.random().toString(36).substring(2,12);

document.getElementById("result").innerText="PASSWORD: "+password;
}

/* ADMIN APPROVE */
function approve(p){
users[p].status="APPROVED";
save();
render();
}

/* RENDER TABLE */
function render(){
let t=document.getElementById("table");
if(!t)return;

t.innerHTML="";

for(let p in users){
t.innerHTML+=`
<tr>
<td>${p}</td>
<td>${users[p].key}</td>
<td>${users[p].status}</td>
<td><button onclick="approve('${p}')">APPROVE</button></td>
</tr>
`;
}
}

setMode('user');

</script>

</body>
</html>
