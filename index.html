<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERVAULT BOOT SYSTEM</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#000;
    color:#00e5ff;
    overflow:hidden;
}

/* BOOT SCREEN */
#boot{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    text-align:center;
}

.logo{
    font-size:28px;
    text-shadow:0 0 15px #00e5ff;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{opacity:0.4}
    50%{opacity:1}
    100%{opacity:0.4}
}

.loader{
    width:35px;
    height:35px;
    border:3px solid #00e5ff33;
    border-top:3px solid #00e5ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-top:15px;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

.small{
    font-size:12px;
    color:#aaa;
    margin-top:10px;
}

/* APP */
#app{
    display:none;
}

/* MATRIX */
canvas{
    position:fixed;
    inset:0;
    opacity:0.12;
}

/* LAYOUT */
.container{
    position:relative;
    z-index:2;
    padding:15px;
}

/* CARD */
.card{
    background:rgba(0,0,0,0.8);
    border:1px solid #00e5ff33;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#000;
    border:1px solid #00e5ff33;
    color:white;
    border-radius:8px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#00e5ff;
    border:none;
    font-weight:bold;
    margin-top:10px;
}

/* EXIT */
.exit{
    background:#ff2d2d;
    color:white;
}

/* PASSWORD */
.password{
    color:#00ff99;
    word-break:break-all;
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">
    <div class="logo">CYBERVAULT</div>
    <div class="small">Welcome to Secure Digital Protection</div>
    <div class="loader"></div>

    <div class="small" style="margin-top:20px;">
        Digital Protection Active
    </div>

    <div class="small" style="margin-top:10px;">
        Developed by Prevellah — Kenya
    </div>
</div>

<!-- APP -->
<div id="app">

<div class="container">

<div class="card">
<h3>CYBERVAULT ACCESS</h3>

<p class="small">
Pay 1 KES via Pochi La Biashara:<br>
*334# → 0142122710
</p>

<input id="phone" placeholder="Phone Number">
<input id="code" placeholder="M-PESA Code">

<button onclick="submit()">Generate Secure Password</button>
<button class="exit" onclick="exitApp()">Exit System</button>

<p id="msg" class="small"></p>
</div>

<div class="card">
<h3>ADMIN PANEL</h3>
<div id="list"></div>
</div>

</div>

</div>

<script>

/* BOOT TIMER */
setTimeout(()=>{
    document.getElementById("boot").style.display="none";
    document.getElementById("app").style.display="block";
},2000);

/* DB */
let db=[];

/* SUBMIT */
function submit(){

const phone=document.getElementById("phone").value;
const code=document.getElementById("code").value;

if(!phone||!code){
alert("Fill all fields");
return;
}

db.push({
id:Date.now(),
phone,
code,
status:"pending",
password:null
});

document.getElementById("msg").innerText=
"Request submitted. Await approval.";

render();
}

/* EXIT */
function exitApp(){
window.location.href="about:blank";
}

/* PASSWORD GENERATOR */
function generate(len=24){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}<>?";

let p="";
const arr=new Uint32Array(len);
crypto.getRandomValues(arr);

for(let i=0;i<len;i++){
p+=chars[arr[i]%chars.length];
}

return p;
}

/* APPROVE */
function approve(id){

const item=db.find(x=>x.id===id);

item.status="approved";
item.password=generate(24);

alert("PASSWORD GENERATED:\n\n"+item.password);

render();
}

/* RENDER */
function render(){

document.getElementById("list").innerHTML=

db.map(i=>`

<div style="border:1px solid #00e5ff22;padding:10px;margin-top:10px;border-radius:10px;">

<p>Phone: ${i.phone}</p>
<p>Code: ${i.code}</p>
<p>Status: ${i.status}</p>

${i.password?`<p class="password">${i.password}</p>`:""}

${i.status==="pending"?
`<button onclick="approve(${i.id})">Approve</button>`:""}

</div>

`).join("");

}

render();

</script>

</body>
</html>
