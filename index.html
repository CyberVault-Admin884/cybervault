<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Vault</title>
  <style>
    /* Absolute reset to ensure your layout matches your original design */
    body {
      background-color: #000000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Your custom green border framing layout */
    .vault-frame {
      border: 2px solid #00ff00;
      margin: 10px;
      padding: 20px;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .vault-title {
      font-size: 2rem;
      text-align: center;
      letter-spacing: 4px;
      margin-top: 40px;
      margin-bottom: 30px;
      color: #00ff00;
      text-transform: uppercase;
    }

    .profile-identity {
      width: 100%;
      max-width: 600px;
      font-size: 0.85rem;
      color: #555555;
      border-bottom: 1px dashed #00ff00;
      padding-bottom: 8px;
      margin-bottom: 30px;
    }

    .profile-identity span {
      color: #00ff00;
    }

    .output-container {
      width: 100%;
      max-width: 600px;
      border: 1px solid #00ff00;
      background: #000000;
      padding: 20px;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 2px;
      word-break: break-all;
      margin-bottom: 40px;
      box-sizing: border-box;
    }

    .interactive-zone {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }

    .matrix-label {
      display: block;
      margin-bottom: 15px;
      font-size: 0.95rem;
      color: #00ff00;
    }

    /* Original sleek slider styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: #000000;
      border: 1px solid #00ff00;
      height: 6px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #00ff00;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff00;
    }

    .metric-panel {
      width: 100%;
      max-width: 600px;
      border-top: 1px dashed #00ff00;
      padding-top: 20px;
      font-size: 0.95rem;
      color: #00ff00;
      line-height: 1.6;
    }

    .status-value {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="vault-frame">
    <div class="vault-title">Cyber Vault</div>
    
    <div class="profile-identity">
      Crypt Profile Identity: <span>VantaX // DEV: prevellah // SECURED</span>
    </div>

    <div class="output-container" id="password-display">Initializing...</div>

    <div class="interactive-zone">
      <label class="matrix-label" for="length-slider">Entropy Length Matrix: <span id="length-val">16</span></label>
      <input type="range" id="length-slider" min="4" max="32" value="16">
    </div>

    <div class="metric-panel">
      Diagnostic Metric Status: <span id="strength-status" class="status-value">Analyzing Matrix...</span>
    </div>
  </div>

  <script>
    // ==========================================
    // Core Engine Logic
    // ==========================================
    const slider = document.getElementById("length-slider");
    const lengthVal = document.getElementById("length-val");
    const passwordDisplay = document.getElementById("password-display");
    const strengthStatus = document.getElementById("strength-status");

    const matrixPool = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";

    function runEngine(matrixLength) {
      let resultStr = "";
      for (let i = 0; i < matrixLength; i++) {
        const targetIndex = Math.floor(Math.random() * matrixPool.length);
        resultStr += matrixPool[targetIndex];
      }
      passwordDisplay.innerText = resultStr;
      evaluateComplexity(matrixLength);
    }

    function evaluateComplexity(len) {
      if (len < 8) {
        strengthStatus.style.color = "#ff0000";
        strengthStatus.innerText = "CRITICAL FLAWS DETECTED (Crack Time: Milliseconds)";
      } else if (len >= 8 && len < 14) {
        strengthStatus.style.color = "#ffff00";
        strengthStatus.innerText = "STANDARD PROTECTION (Crack Time: Years)";
      } else {
        strengthStatus.style.color = "#00ff00";
        strengthStatus.innerText = "MILITARY-GRADE SECURITY (Crack Time: INFINITE)";
      }
    }

    slider.addEventListener("input", (e) => {
      const value = parseInt(e.target.value);
      lengthVal.innerText = value;
      runEngine(value);
    });

    // Run engine on startup
    window.onload = () => {
      runEngine(parseInt(slider.value));
    };

    // ==========================================
    // Background Anti-Intruder Logic (Invisible)
    // ==========================================
    const watchForInspectors = () => {
      const limit = 160;
      if (window.innerWidth > 768) {
        if (window.outerWidth - window.innerWidth > limit || 
            window.outerHeight - window.innerHeight > limit) {
          
          document.body.innerHTML = `
            <div style="background:#000000; color:#00ff00; font-family:monospace; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; box-sizing:border-box;">
              <h2 style="color:#ff0000; letter-spacing: 2px;">[!] CRITICAL WARNING: INTRUSION DETECTED</h2>
              <p style="font-size: 1.1rem; margin-top: 10px;">Unauthorized inspection of Cyber Vault source code detected.</p>
              <p style="color:#888;">Crypt Profile Identity: SECURED // OPERATOR: prevellah</p>
              <button onclick="location.reload()" style="background:transparent; border:1px solid #00ff00; color:#00ff00; padding:10px 20px; margin-top:20px; cursor:pointer; font-family:monospace;">RE-AUTHENTICATE</button>
            </div>
          `;
          clearInterval(safetyCheckLoop);
        }
      }
    };
    const safetyCheckLoop = setInterval(watchForInspectors, 1000);

    localStorage.setItem('admin_session_key', 'VAULT_MASTER_SECRET_DO_NOT_ALTER');
    window.addEventListener('storage', (event) => {
      if (event.key === 'admin_session_key') {
        alert("ALERT: Honey-token tampering detected! Vault entry denied.");
        localStorage.clear();
        window.location.reload();
      }
    });
  </script>
</body>
</html>
