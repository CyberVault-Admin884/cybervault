<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERVAULT | SEC-OPS V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #000; color: #00ff41; min-height: 100vh; margin: 0; overflow: hidden; }
        .vault-card { background: rgba(10, 10, 10, 0.95); border: 1px solid rgba(0, 255, 65, 0.3); box-shadow: 0 0 50px rgba(0, 255, 65, 0.1); }
        .scan-line { width: 100%; height: 2px; background: #00ff41; position: absolute; opacity: 0.3; animation: scan 3s linear infinite; }
        @keyframes scan { 0% { top: 0% } 100% { top: 100% } }
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="scan-line"></div>

    <div id="vault-core" class="w-full max-w-sm vault-card rounded-[2rem] p-8 relative overflow-hidden border-t-4 border-t-green-500">
        <div class="text-center mb-8 border-b border-green-500/20 pb-4">
            <h1 class="text-2xl font-black tracking-tighter text-white uppercase italic">Cyber<span class="text-green-500">Vault</span></h1>
            <p class="text-[8px] tracking-[0.4em] text-green-500/50 mt-1 uppercase">Node: Eldoret_Sec_Ops</p>
        </div>

        <div id="display-engine" class="space-y-6">
            <div id="auth-phase">
                <p class="text-[9px] text-zinc-500 uppercase text-center mb-4 tracking-widest">Awaiting Credentials...</p>
                <input type="text" id="access-id" placeholder="ID: 07XXXXXXXX" class="w-full bg-black border border-green-500/20 rounded-xl py-4 px-4 text-center text-white font-bold tracking-[0.2em] outline-none focus:border-green-500 transition-all placeholder:text-zinc-800 mb-4">
                <button onclick="processAuth()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-widest hover:bg-white transition-all">Initialize Node</button>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[7px] text-zinc-700 uppercase tracking-[0.5em]">Terminal Stateless | V4.0.2</p>
        </div>
    </div>

    <script>
        let key = "";
        function processAuth() {
            const v = document.getElementById('access-id').value;
            if (v === "0000" || /^(07|01)\d{8}$/.test(v)) {
                document.getElementById('display-engine').innerHTML = `<div class="py-8 text-center"><div class="inline-block animate-spin h-6 w-6 border-2 border-green-500 border-t-transparent rounded-full mb-4"></div><p class="text-[9px] tracking-widest animate-pulse">BYPASSING FIREWALL...</p></div>`;
                setTimeout(showPay, 1500);
            }
        }

        function showPay() {
            document.getElementById('display-engine').innerHTML = `
                <div class="space-y-4 animate-in slide-in-from-bottom duration-300">
                    <div class="bg-zinc-900/50 p-5 rounded-2xl border border-green-500/10 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase mb-2">Pochi La Biashara</p>
                        <span class="text-2xl font-black text-white">0142122710</span>
                        <p class="text-[9px] text-green-500 mt-2 font-bold uppercase tracking-widest">MAINTENANCE: 1 KES</p>
                    </div>
                    <input type="text" id="mcode" placeholder="M-PESA CODE" class="w-full bg-black border border-zinc-800 rounded-xl py-4 text-center text-white text-[10px] font-bold outline-none focus:border-green-500">
                    <button onclick="genKey()" class="w-full bg-white text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-widest">Generate Master</button>
                </div>`;
        }

        function genKey() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*";
            key = "SEC-" + Array.from({length: 14}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            document.getElementById('display-engine').innerHTML = `
                <div class="space-y-5 text-center">
                    <p class="text-[8px] text-green-500 font-bold tracking-widest uppercase">Encryption Key Locked</p>
                    <div class="bg-black py-8 rounded-2xl border-2 border-green-500/30 text-white font-mono text-lg font-black break-all px-4">${key}</div>
                    <button onclick="copyToClipboard(this)" class="w-full bg-green-500 text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-widest">Copy to Clipboard</button>
                </div>`;
        }

        async function copyToClipboard(btn) {
            try {
                await navigator.clipboard.writeText(key);
                btn.innerText = "✓ COPIED";
                btn.style.backgroundColor = "#fff";
                setTimeout(() => { btn.innerText = "Copy to Clipboard"; btn.style.backgroundColor = "#00ff41"; }, 2000);
            } catch(e) { alert("Key: " + key); }
        }
    </script>
</body>
</html>
