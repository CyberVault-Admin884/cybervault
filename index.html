
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVAULT | ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: monospace; overflow-x: hidden; }
        .glow { box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); border: 1px solid rgba(0, 255, 65, 0.3); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-10">
        <h1 class="text-3xl font-black tracking-widest text-white">CYBER<span class="text-green-500">VAULT</span></h1>
        <p class="text-[10px] text-green-500/50 tracking-widest">PREVELLAH SEC-OPS v1.16</p>
    </div>

    <div id="payment-box" class="w-full max-w-md bg-black p-8 rounded-3xl glow">
        <div id="interface">
            <label class="text-[10px] text-zinc-500 uppercase block mb-4 text-center">Identity Verification</label>
            <input type="number" id="phone" placeholder="07XX XXX XXX" class="w-full bg-zinc-900 border border-zinc-800 py-4 text-center text-white font-bold rounded-2xl mb-6 outline-none focus:border-green-500">
            <button onclick="checkAccess()" class="w-full bg-green-500 text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-widest hover:bg-white transition-all">Open Vault</button>
        </div>
        <div id="status"></div>
    </div>

    <script>
        function getPass() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%";
            let res = "PREV-";
            for (let i = 0; i < 8; i++) { res += chars.charAt(Math.floor(Math.random() * chars.length)); }
            return res;
        }

        function refreshKey() {
            document.getElementById('key-display').innerText = getPass();
        }

        function showGen(isDev) {
            document.getElementById('status').innerHTML = '<p class="text-green-500 animate-pulse text-center text-[10px] mt-4 uppercase">Accessing Core...</p>';
            setTimeout(() => {
                document.getElementById('payment-box').innerHTML = `
                    <div class="text-center">
                        <span class="text-green-500 text-[9px] font-black border border-green-500/30 px-4 py-1 rounded-full">GENERATOR ACTIVE</span>
                        <div id="key-display" class="text-2xl font-black text-white py-10 my-6 bg-zinc-900/50 rounded-2xl border border-green-500/10 tracking-widest">${getPass()}</div>
                        <button onclick="refreshKey()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl text-[10px] uppercase mb-4">Regenerate Key</button>
                        <button onclick="location.reload()" class="text-[9px] text-zinc-600 uppercase font-black">Exit Terminal</button>
                    </div>`;
            }, isDev ? 200 : 2000);
        }

        function checkAccess() {
            let p = document.getElementById('phone').value;
            if(p === "0000") { showGen(true); return; }
            if(p.length < 9) return;
            
            document.getElementById('interface').classList.add('hidden');
            document.getElementById('status').innerHTML = `
                <div class="text-left space-y-4">
                    <p class="text-green-500 text-[10px] font-black text-center uppercase tracking-widest">M-Pesa Verification</p>
                    <div class="text-[11px] text-zinc-400 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800">
                        1. Dial *334#<br>2. Pochi La Biashara<br>3. Send to: <span class="text-white">0142122710</span><br>4. Amount: 1 KES
                    </div>
                    <input type="text" id="code" placeholder="ENTER TRANSACTION CODE" class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white text-xs uppercase outline-none focus:border-green-500">
                    <button onclick="showGen(false)" class="w-full bg-white text-black font-black py-4 rounded-xl text-[10px] uppercase">Validate Payment</button>
                </div>`;
        }
    </script>
</body>
</html>
