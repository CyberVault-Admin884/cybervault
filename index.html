
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVAULT | PREVELLAH SEC-OPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #00ff41; margin: 0; overflow-x: hidden; }
        #main-content { clip-path: circle(0% at 50% 50%); transition: clip-path 1.8s cubic-bezier(0.77, 0, 0.175, 1); }
        #main-content.open { clip-path: circle(150% at 50% 50%); }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(0, 255, 65, 0.05); z-index: 50; animation: scan 8s linear infinite; pointer-events: none; }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }
        .glow-border { box-shadow: 0 0 25px rgba(0, 255, 65, 0.15); border: 1px solid rgba(0, 255, 65, 0.3); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative">
    <div class="scanline"></div>

    <div id="start-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#050505] transition-opacity duration-1000">
        <div class="text-center space-y-6 px-6">
            <h1 class="text-4xl font-black tracking-[0.5em] text-white">PREVELLAH</h1>
            <p class="text-[10px] text-green-500 tracking-[0.3em] uppercase">Kenya's Elite Security Infrastructure</p>
            <button onclick="unlockVault()" class="mt-8 px-10 py-5 border-2 border-green-500 text-green-500 font-black text-xs uppercase tracking-[0.4em] hover:bg-green-500 hover:text-black transition-all rounded-full animate-pulse">
                Click Here to Start
            </button>
        </div>
    </div>

    <div id="main-content" class="w-full min-h-screen flex flex-col items-center p-4 pb-20 opacity-0 transition-opacity duration-500">
        <div class="text-center mt-10 mb-8">
            <h1 class="text-3xl font-black tracking-[0.4em] text-white">CYBER<span class="text-green-500">VAULT</span></h1>
            <p class="text-[10px] text-green-500/60 tracking-[0.5em] uppercase font-bold">Terminal v1.15 ADMIN</p>
        </div>

        <div class="w-full max-w-md mb-6 p-6 bg-green-500/5 rounded-2xl border border-green-500/20">
            <h2 class="text-white text-xs font-black uppercase tracking-widest mb-3">💎 UNBREAKABLE PASSWORDS</h2>
            <p class="text-[11px] text-zinc-400 leading-relaxed">Customize and generate military-grade keys instantly.</p>
        </div>

        <div id="payment-box" class="w-full max-w-md bg-black border border-green-500/30 p-8 rounded-3xl glow-border relative z-10">
            <div class="space-y-6">
                <input type="number" id="phone" placeholder="07XX XXX XXX" class="w-full bg-zinc-900/40 border border-zinc-800 py-4 px-6 text-center text-white font-bold rounded-2xl outline-none focus:border-green-500 transition-all">
                <button onclick="initiateVault()" class="w-full bg-green-500 text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-[0.2em] hover:bg-white transition-all shadow-lg shadow-green-500/20">ACCESS GENERATOR</button>
            </div>
            <div id="status" class="mt-4"></div>
        </div>

        <footer class="mt-12 text-[9px] text-zinc-700 tracking-[0.3em] uppercase">© 2026 PREVELLAH SEC-OPS</footer>
    </div>

    <script>
        function unlockVault() {
            const ss = document.getElementById('start-screen');
            const mc = document.getElementById('main-content');
            ss.style.opacity = '0';
            setTimeout(() => { ss.classList.add('hidden'); mc.style.opacity = '1'; mc.classList.add('open'); }, 500);
        }

        function generateNewPass() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*";
            let res = "PREV-";
            for (let i = 0; i < 8; i++) { res += chars.charAt(Math.floor(Math.random() * chars.length)); }
            return res;
        }

        function updatePass() {
            const display = document.getElementById('pass-display');
            display.classList.add('animate-pulse');
            setTimeout(() => {
                display.innerText = generateNewPass();
                display.classList.remove('animate-pulse');
            }, 200);
        }

        function showGenerator(isDev = false) {
            let msg = isDev ? "ADMIN BYPASS GRANTED..." : "SYNTHESIZING ACCESS...";
            document.getElementById('status').innerHTML = `<p class="text-green-500 animate-pulse text-[10px] mt-4 tracking-[0.2em] font-black text-center">${msg}</p>`;
            
            setTimeout(() => {
                document.getElementById('payment-box').innerHTML = `
                    <div class="text-center py-4">
                        <span class="text-green-500 text-[9px] font-black border border-green-500/50 px-4 py-1 rounded-full uppercase tracking-widest">Inbuilt Generator Active</span>
                        <div id="pass-display" class="text-2xl font-black tracking-widest text-white py-8 my-6 bg-zinc-900/40 rounded-2xl border border-green-500/10">${generateNewPass()}</div>
                        <button onclick="updatePass()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl text-[10px] uppercase tracking-widest hover:bg-white transition-all mb-6">Regenerate New Key</button>
                        <button onclick="location.reload()" class="text-[9px] text-red-500/50 uppercase font-black">Destroy Session</button>
                    </div>`;
            }, isDev ? 500 : 2000);
        }

        function initiateVault() {
            let phone = document.getElementById('phone').value.trim();
            if(phone === "0000") { showGenerator(true); return; } 
            if(phone.length < 9) return;
            document.getElementById('status').innerHTML = `
                <div class="bg-zinc-900/90 border border-green-500/40 p-6 rounded-2xl mt-8 text-left">
                    <p class="text-[9px] text-green-500 font-black uppercase mb-4 tracking-widest text-center">Support Gateway</p>
                    <div class="space-y-2 text-[11px] text-zinc-300 font-bold border-b border-zinc-800 pb-4">
                        <p>1. Dial *334# | 2. Pochi La Biashara</p>
                        <p>3. ID: <span class="text-green-500">0142122710</span> | 4. Amt: 1 KES</p>
                    </div>
                    <input type="text" id="mPesaCode" placeholder="PASTE M-PESA CODE" class="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white mt-4 text-xs uppercase font-black outline-none focus:border-green-500">
                    <button onclick="verifyCode()" class="w-full bg-white text-black font-black py-4 rounded-xl text-[10px] mt-4 uppercase tracking-widest">VALIDATE & UNLOCK</button>
                </div>`;
        }

        function verifyCode() {
            const code = document.getElementById('mPesaCode').value.trim();
            if(code.length < 8) return;
            showGenerator(false);
        }
    </script>
</body>
</html>
