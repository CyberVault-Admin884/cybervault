<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERVAULT | GLOBAL SECURITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intl-tel-input.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { background-color: #050505; color: #eee; font-family: 'Space Mono', monospace; }
        .vault-card { background: #0f0f0f; border: 1px solid #1a1a1a; box-shadow: 0 0 30px rgba(0,0,0,1); }
        .accent-green { color: #00ff41; }
        .bg-green { background-color: #00ff41; color: #000; }
        
        /* THE FIX: Force Flag Visibility */
        .iti { width: 100% !important; display: block !important; }
        .iti__selected-flag { 
            background-color: #111 !important; 
            border-right: 1px solid #333 !important; 
            padding: 0 15px !important;
            border-radius: 12px 0 0 12px !important;
        }
        /* This ensures the text starts AFTER the flag and arrow */
        input#phone { 
            padding-left: 100px !important; 
            background: #000 !important; 
            border: 1px solid #333 !important; 
            height: 60px !important;
            color: #00ff41 !important;
            width: 100% !important;
        }
        .iti__country-list { background-color: #0a0a0a !important; color: #00ff41 !important; border: 1px solid #333 !important; }
        .iti__arrow { border-top-color: #00ff41 !important; }
        
        .loader { border: 2px solid #111; border-top: 2px solid #00ff41; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-12">
        <div class="space-y-6">
            <h1 class="text-4xl font-black accent-green italic uppercase tracking-tighter">CYBERVAULT</h1>
            <div class="space-y-4 text-xs text-gray-400">
                <div class="bg-white/5 p-4 rounded border-l border-green-500">
                    <p class="text-[11px] font-bold text-white mb-1 uppercase">Gateway Status:</p>
                    <p>Active for M-PESA regions (KE, TZ, UG). International card processing in sandbox.</p>
                </div>
            </div>
        </div>

        <div class="vault-card p-10 rounded-2xl border-t-2 border-green-500">
            <div id="payment-box">
                <h2 class="text-center font-bold mb-8 text-white text-xs uppercase tracking-widest">Authorize Access</h2>
                <div class="space-y-8">
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase block mb-2 font-bold">Select Flag / Region</label>
                        <input type="tel" id="phone" autocomplete="off" class="rounded-xl outline-none">
                    </div>
                    <button onclick="initiateVault()" id="payBtn" class="w-full bg-green font-black py-4 rounded-xl uppercase text-xs flex justify-center items-center gap-3 active:opacity-80">
                        <span id="btnText">UNLOCK (1 KES)</span>
                        <div id="spinner" class="loader"></div>
                    </button>
                    <p id="status" class="text-[9px] text-center text-gray-400 italic h-4 uppercase"></p>
                </div>
            </div>
            <div id="generator-box" class="hidden text-center space-y-6">
                <div class="py-10 border border-green-500/20 rounded-lg">
                    <div id="pass-out" class="text-2xl font-bold text-white">********</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intl-tel-input.min.js"></script>
    <script>
        const phoneInput = document.querySelector("#phone");
        // Initialize with separateDialCode: true to show the +254 clearly
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "ke",
            separateDialCode: true,
            preferredCountries: ["ke", "tz", "ug"],
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
        });

        function checkRegion() {
            const countryData = iti.getSelectedCountryData();
            const payBtn = document.getElementById('payBtn');
            const btnText = document.getElementById('btnText');
            const allowed = ["ke", "tz", "ug"];

            if (!allowed.includes(countryData.iso2)) {
                payBtn.style.backgroundColor = "#333";
                btnText.innerText = "REGION NOT SUPPORTED";
                payBtn.disabled = true;
            } else {
                payBtn.style.backgroundColor = "#00ff41";
                btnText.innerText = "UNLOCK (1 KES)";
                payBtn.disabled = false;
            }
        }

        phoneInput.addEventListener("countrychange", checkRegion);

        async function initiateVault() {
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const status = document.getElementById('status');
            const fullNumber = iti.getNumber().replace('+', '');

            if(!iti.isValidNumber()) { status.innerText = "INVALID NUMBER"; return; }

            spinner.style.display = "block";
            btnText.innerText = "WORKING...";

            try {
                const res = await fetch('https://tinypesa.com/api/v1/express/initialize', {
                    method: 'POST',
                    headers: { 'Apikey': 'q6O764F6G75', 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `amount=1&msisdn=${fullNumber}&account_no=CYBERVAULT`
                });

                if(res.ok) {
                    status.innerText = "PUSH SENT. CHECK PHONE.";
                    setTimeout(() => {
                        document.getElementById('payment-box').style.display = "none";
                        document.getElementById('generator-box').classList.remove('hidden');
                        document.getElementById('pass-out').innerText = "CV-" + Math.random().toString(36).substring(2, 10).toUpperCase();
                    }, 5000);
                }
            } catch (e) {
                status.innerText = "GATEWAY ERROR";
            } finally {
                spinner.style.display = "none";
                btnText.innerText = "UNLOCK (1 KES)";
            }
        }
    </script>
</body>
</html>
