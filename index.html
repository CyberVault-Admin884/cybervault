<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERVAULT | SEC-OPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { background: #000; color: #00ff41; font-family: 'JetBrains Mono', monospace; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.25; }
        .card { background: rgba(10,10,10,0.98); border: 1px solid #00ff41; border-radius: 1rem; width: 90%; max-width: 360px; padding: 25px; box-shadow: 0 0 30px rgba(0,255,65,0.1); }
        input { background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; width: 100%; padding: 15px; text-align: center; outline: none; font-size: 16px; margin-top: 10px; }
        .btn { background: #00ff41; color: #000; width: 100%; padding: 16px; border-radius: 8px; font-weight: 900; text-transform: uppercase; margin-top: 15px; cursor: pointer; border: none; }
        .btn:active { background: #fff; transform: scale(0.98); }
        #reveal-screen { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .logo-pulse { font-size: 2.5rem; color: #fff; letter-spacing: 4px; animation: pulse 0.8s infinite alternate; font-weight: 900; font-style: italic; }
        @keyframes pulse { from { opacity: 0.4; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
        .error-state { border-color: #ff0000 !important; color: #ff0000 !important; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>

    <div id="ui-wrap" class="w-full flex flex-col items-center">
        <div class="card mb-4">
            <h2 class="text-[9px] text-zinc-500 uppercase tracking-widest mb-2">System Protocol</h2>
            <p class="text-[11px] leading-relaxed">Maintenance fee: 1 KES via Pochi La Biashara.</p>
        </div>

        <div id="action-card" class="card">
            <div id="flow">
                <p class="text-center text-[10px] text-zinc-400 uppercase tracking-widest">Secure Access Node</p>
                <button onclick="startFlow()" class="btn">Authorize Gateway</button>
            </div>
        </div>
    </div>

    <div id="reveal-screen">
        <div class="text-center">
            <h1 class="logo-pulse">CYBER<span class="text-green-500">VAULT</span></h1>
            <p class="text-[8px] text-green-500 tracking-[0.8em] mt-4 uppercase">Syncing Protocols</p>
        </div>
    </div>

    <script>
        const c = document.getElementById('m');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const drops = Array(Math.floor(c.width/16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = "#00ff41"; ctx.font = "16px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
                if(y*16 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 45);

        function startFlow() {
            document.getElementById('flow').innerHTML = `<div class="py-10 text-center"><div class="inline-block border-2 border-green-500 border-t-transparent rounded-full w-8 h-8 animate-spin"></div></div>`;
            setTimeout(() => { document.getElementById('reveal-screen').style.display = 'flex'; }, 800);
            setTimeout(showPayment, 3200);
        }

        function showPayment() {
            document.getElementById('reveal-screen').style.display = 'none';
            document.getElementById('flow').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-zinc-900/80 p-5 rounded-xl border border-green-500/30 text-center">
                        <p class="text-[9px] text-zinc-500 mb-1 uppercase tracking-widest">Pochi La Biashara</p>
                        <p class="text-2xl font-bold text-white tracking-widest">0142122710</p>
                    </div>
                    <p class="text-[9px] text-center text-zinc-500 uppercase">Verification Credentials</p>
                    <input type="text" id="mobile" placeholder="MOBILE: 07XXXXXXXX" maxlength="10" inputmode="numeric">
                    <input type="text" id="mcode" placeholder="M-PESA TRANSACTION CODE" class="uppercase">
                    <button onclick="validateAndUnlock()" class="btn !bg-white">Validate & Unlock</button>
                </div>`;
        }

        function validateAndUnlock() {
            const mobileInput = document.getElementById('mobile');
            const mCodeInput = document.getElementById('mcode');
            
            // STRICT VALIDATION
            const isPhoneValid = /^(07|01)\d{8}$/.test(mobileInput.value);
            const isCodeValid = mCodeInput.value.length >= 6; // Basic check for M-Pesa code length

            if (!isPhoneValid || !isCodeValid) {
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                if(!isPhoneValid) mobileInput.classList.add('error-state');
                if(!isCodeValid) mCodeInput.classList.add('error-state');
                
                setTimeout(() => { 
                    mobileInput.classList.remove('error-state');
                    mCodeInput.classList.remove('error-state');
                }, 1500);
                return; // STOP: No key generated
            }

            // SUCCESS ONLY AFTER VALIDATION
            const k = "SEC-" + Math.random().toString(36).substring(2,12).toUpperCase();
            document.getElementById('flow').innerHTML = `
                <div class="space-y-5 text-center">
                    <div class="bg-black py-8 border border-green-500/20 text-white font-bold break-all px-4 text-lg">${k}</div>
                    <button onclick="copy('${k}', this)" class="btn">Copy to Clipboard</button>
                    <button onclick="location.reload()" class="text-[8px] text-zinc-700 uppercase mt-4 block mx-auto underline tracking-widest">New Session</button>
                </div>`;
        }

        async function copy(val, btn) {
            await navigator.clipboard.writeText(val);
            btn.innerText = "COPIED ✅"; btn.style.background = "#fff";
            setTimeout(() => { btn.innerText = "Copy to Clipboard"; btn.style.background = "#00ff41"; }, 2000);
        }
    </script>
</body>
</html>
